<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc">
  <title id="title">Схема реализации «Поток»</title>
  <desc id="desc">Браузер, nginx с Vue SPA, GoTrue, PostgREST и PostgreSQL с RLS в Docker Compose.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1400" height="880" fill="#f8fafc" />

  <text x="60" y="58" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">
    Поток — схема реализации
  </text>
  <text x="60" y="88" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" fill="#64748b">
    Канбан-доска задач: приватность по умолчанию, роли, комментарии и история
  </text>

  <!-- Доступ -->
  <rect x="1010" y="36" width="330" height="78" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)" />
  <text x="1032" y="62" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">
    ДОСТУП
  </text>
  <text x="1032" y="84" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#334155">
    локально: http://localhost:8080
  </text>
  <text x="1032" y="103" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#4338ca">
    в сети:   http://&lt;IP&gt;:8080
  </text>

  <!-- Браузер -->
  <rect x="50" y="150" width="300" height="230" rx="18" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" filter="url(#shadow)" />
  <text x="74" y="182" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6366f1" letter-spacing="1">
    КЛИЕНТ
  </text>
  <text x="74" y="214" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#1e1b4b">
    Браузер / телефон
  </text>
  <text x="74" y="246" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" fill="#3730a3">
    Vue 3 SPA · Composition API
  </text>
  <text x="74" y="271" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" fill="#3730a3">
    Vite 8 · Tailwind CSS 4
  </text>
  <text x="74" y="296" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" fill="#3730a3">
    supabase-js: Auth + REST
  </text>
  <text x="74" y="321" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#3730a3">
    сессия в localStorage
  </text>
  <text x="74" y="348" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#6366f1">
    адаптивность: 360–1440+ px
  </text>

  <!-- Docker Compose -->
  <rect x="410" y="110" width="930" height="690" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 6" />
  <text x="434" y="142" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1.2">
    DOCKER COMPOSE · ЛОКАЛЬНЫЙ ЗАПУСК (ОДНА КОМАНДА)
  </text>

  <!-- nginx -->
  <rect x="450" y="170" width="340" height="200" rx="16" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5" filter="url(#shadow)" />
  <text x="472" y="204" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#155e75">
    app · nginx
  </text>
  <text x="472" y="230" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#0e7490">
    SPA и прокси API на одном origin
  </text>
  <text x="472" y="262" font-family="Cascadia Mono, Consolas, monospace" font-size="13" fill="#155e75">
    /            → Vue SPA
  </text>
  <text x="472" y="287" font-family="Cascadia Mono, Consolas, monospace" font-size="13" fill="#155e75">
    /auth/v1/*   → auth:9999
  </text>
  <text x="472" y="312" font-family="Cascadia Mono, Consolas, monospace" font-size="13" fill="#155e75">
    /rest/v1/*   → rest:3000
  </text>
  <text x="472" y="344" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#0e7490">
    порт 8080 · CORS не нужен
  </text>

  <!-- GoTrue -->
  <rect x="860" y="180" width="300" height="150" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)" />
  <text x="882" y="214" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#166534">
    GoTrue
  </text>
  <text x="882" y="238" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#15803d">
    Supabase Auth
  </text>
  <text x="882" y="266" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" fill="#166534">
    регистрация · вход · выход
  </text>
  <text x="882" y="289" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" fill="#166534">
    JWT access / refresh
  </text>
  <text x="882" y="312" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#15803d">
    таблица auth.users
  </text>

  <!-- PostgREST -->
  <rect x="860" y="380" width="300" height="150" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)" />
  <text x="882" y="414" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#1e40af">
    PostgREST
  </text>
  <text x="882" y="438" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#1d4ed8">
    Supabase REST API
  </text>
  <text x="882" y="466" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" fill="#1e40af">
    задачи · комментарии · история
  </text>
  <text x="882" y="489" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" fill="#1e40af">
    фильтры, поиск, embed-связи
  </text>
  <text x="882" y="512" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#1d4ed8">
    роль authenticated + JWT
  </text>

  <!-- PostgreSQL -->
  <rect x="860" y="590" width="300" height="180" rx="16" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#shadow)" />
  <text x="882" y="624" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#6b21a8">
    PostgreSQL 15
  </text>
  <text x="882" y="648" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#7e22ce">
    Supabase Postgres
  </text>
  <text x="882" y="676" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#581c87">
    auth.users
  </text>
  <text x="882" y="698" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#581c87">
    profiles · tickets
  </text>
  <text x="882" y="720" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#581c87">
    comments · ticket_events
  </text>
  <text x="882" y="746" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#6b21a8">
    RLS: автор / исполнитель / обзор
  </text>

  <!-- migrate -->
  <rect x="450" y="430" width="340" height="110" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="472" y="462" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">
    db-setup + migrate
  </text>
  <text x="472" y="487" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#475569">
    пароли служебных ролей
  </text>
  <text x="472" y="508" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#475569">
    идемпотентные SQL-миграции
  </text>

  <!-- Стрелки -->
  <line x1="350" y1="255" x2="442" y2="255" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="362" y="243" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#475569">
    HTTP :8080
  </text>

  <line x1="790" y1="255" x2="852" y2="255" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="797" y="243" font-family="Cascadia Mono, Consolas, monospace" font-size="11.5" fill="#475569">
    /auth/v1/*
  </text>

  <path d="M 790 330 L 825 330 L 825 455 L 852 455" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="800" y="320" font-family="Cascadia Mono, Consolas, monospace" font-size="11.5" fill="#475569">
    /rest/v1/*
  </text>

  <path d="M 1160 255 L 1195 255 L 1195 650 L 1168 650" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1204" y="455" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#475569" transform="rotate(90 1204 455)">
    auth schema
  </text>

  <line x1="1010" y1="530" x2="1010" y2="582" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1021" y="560" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#475569">
    SQL + RLS
  </text>

  <path d="M 790 485 L 825 485 L 825 650 L 852 650" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="800" y="475" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#475569">
    DDL
  </text>

  <!-- Легенда -->
  <text x="60" y="832" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">
    Легенда
  </text>
  <line x1="60" y1="854" x2="108" y2="854" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="118" y="858" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">
    HTTP-запросы
  </text>

  <rect x="410" y="820" width="930" height="42" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="432" y="846" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">
    Приложение доступно локально и в локальной сети; порт 8080 опубликован Docker.
  </text>
</svg>
