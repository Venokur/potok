<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1010" viewBox="0 0 1500 1010" role="img" aria-labelledby="title desc">
  <title id="title">Схема реализации «Поток»</title>
  <desc id="desc">Браузер, Cloudflare Tunnel, nginx с Vue SPA, GoTrue, PostgREST и PostgreSQL с RLS в Docker Compose.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1500" height="1010" fill="#f8fafc" />

  <!-- Заголовок -->
  <text x="60" y="62" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">
    Поток — схема реализации
  </text>
  <text x="60" y="92" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" fill="#64748b">
    Канбан-доска задач: приватность по умолчанию, роли, комментарии и история
  </text>

  <!-- Доступы -->
  <rect x="1050" y="36" width="400" height="78" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)" />
  <text x="1072" y="62" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">
    ДОСТУП
  </text>
  <text x="1072" y="84" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#334155">
    локально: http://localhost:8080
  </text>
  <text x="1072" y="103" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#4338ca">
    публично: https://*.trycloudflare.com
  </text>

  <!-- Браузер -->
  <rect x="50" y="160" width="310" height="220" rx="18" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" filter="url(#shadow)" />
  <text x="74" y="192" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6366f1" letter-spacing="1">
    КЛИЕНТ
  </text>
  <text x="74" y="222" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#1e1b4b">
    Браузер / телефон
  </text>
  <text x="74" y="252" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" fill="#3730a3">
    Vue 3 SPA · Composition API
  </text>
  <text x="74" y="277" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" fill="#3730a3">
    Vite 8 · Tailwind CSS 4
  </text>
  <text x="74" y="302" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" fill="#3730a3">
    supabase-js: Auth + REST
  </text>
  <text x="74" y="327" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" fill="#3730a3">
    сессия в localStorage
  </text>
  <text x="74" y="356" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#6366f1">
    адаптивность: 360–1440+ px
  </text>

  <!-- Docker Compose -->
  <rect x="430" y="120" width="1030" height="760" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 6" />
  <text x="454" y="152" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1.2">
    DOCKER COMPOSE · ЛОКАЛЬНЫЙ ЗАПУСК (ОДНА КОМАНДА)
  </text>

  <!-- Cloudflare -->
  <rect x="470" y="170" width="310" height="130" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#shadow)" />
  <text x="492" y="202" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#9a3412">
    cloudflared
  </text>
  <text x="492" y="228" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" fill="#c2410c">
    quick tunnel · HTTPS · без аккаунта
  </text>
  <text x="492" y="253" font-family="Cascadia Mono, Consolas, monospace" font-size="12" fill="#9a3412">
    https://*.trycloudflare.com
  </text>
  <text x="492" y="277" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#c2410c">
    ссылка меняется после restart tunnel
  </text>

  <!-- nginx + SPA -->
  <rect x="470" y="370" width="330" height="210" rx="16" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5" filter="url(#shadow)" />
  <text x="492" y="402" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#155e75">
    app · nginx
  </text>
  <text x="492" y="428" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" fill="#0e7490">
    раздаёт SPA и проксирует API на одном origin
  </text>
  <text x="492" y="460" font-family="Cascadia Mono, Consolas, monospace" font-size="13" fill="#155e75">
    /            → Vue SPA
  </text>
  <text x="492" y="485" font-family="Cascadia Mono, Consolas, monospace" font-size="13" fill="#155e75">
    /auth/v1/*   → auth:9999
  </text>
  <text x="492" y="510" font-family="Cascadia Mono, Consolas, monospace" font-size="13" fill="#155e75">
    /rest/v1/*   → rest:3000
  </text>
  <text x="492" y="542" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#0e7490">
    порт 8080 · конфиг Supabase подставляется в runtime
  </text>
  <text x="492" y="564" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#0e7490">
    CORS не нужен: браузер ходит на тот же origin
  </text>

  <!-- GoTrue -->
  <rect x="900" y="200" width="300" height="140" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)" />
  <text x="922" y="232" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#166534">
    GoTrue
  </text>
  <text x="922" y="256" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#15803d">
    Supabase Auth
  </text>
  <text x="922" y="284" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" fill="#166534">
    регистрация · вход · выход
  </text>
  <text x="922" y="307" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" fill="#166534">
    JWT access / refresh
  </text>
  <text x="922" y="328" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#15803d">
    таблица auth.users
  </text>

  <!-- PostgREST -->
  <rect x="900" y="410" width="300" height="140" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)" />
  <text x="922" y="442" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#1e40af">
    PostgREST
  </text>
  <text x="922" y="466" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#1d4ed8">
    Supabase REST API
  </text>
  <text x="922" y="494" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" fill="#1e40af">
    CRUD задач и комментариев
  </text>
  <text x="922" y="517" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" fill="#1e40af">
    фильтры, поиск, embed-связи
  </text>
  <text x="922" y="538" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#1d4ed8">
    роль authenticated + JWT
  </text>

  <!-- PostgreSQL -->
  <rect x="900" y="610" width="300" height="240" rx="16" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#shadow)" />
  <text x="922" y="642" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#6b21a8">
    PostgreSQL 15
  </text>
  <text x="922" y="666" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#7e22ce">
    Supabase Postgres
  </text>
  <text x="922" y="694" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#581c87">
    auth.users
  </text>
  <text x="922" y="716" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#581c87">
    profiles · tickets
  </text>
  <text x="922" y="738" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#581c87">
    comments · ticket_events
  </text>
  <text x="922" y="768" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#6b21a8">
    RLS: автор / исполнитель / обзор
  </text>
  <text x="922" y="790" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#6b21a8">
    триггеры пишут историю
  </text>
  <text x="922" y="812" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#7e22ce">
    приватность по умолчанию
  </text>
  <text x="922" y="833" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#7e22ce">
    ограничение действует и в API
  </text>

  <!-- db-setup + migrate -->
  <rect x="470" y="630" width="330" height="100" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="492" y="660" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">
    db-setup + migrate
  </text>
  <text x="492" y="685" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#475569">
    пароли служебных ролей
  </text>
  <text x="492" y="706" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#475569">
    идемпотентные SQL-миграции
  </text>

  <!-- Стрелки -->
  <!-- Browser -> cloudflared -->
  <line x1="360" y1="248" x2="462" y2="248" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="372" y="236" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#475569">
    HTTPS
  </text>

  <!-- Browser -> app (localhost) -->
  <path d="M 205 380 L 205 480 L 462 480" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
  <text x="216" y="470" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#64748b">
    localhost:8080 — напрямую
  </text>

  <!-- cloudflared -> app -->
  <line x1="625" y1="300" x2="625" y2="362" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="636" y="338" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#475569">
    app:80
  </text>

  <!-- app -> auth -->
  <path d="M 800 425 L 850 425 L 850 270 L 892 270" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="806" y="412" font-family="Cascadia Mono, Consolas, monospace" font-size="12" fill="#475569">
    /auth/v1/*
  </text>

  <!-- app -> rest -->
  <line x1="800" y1="500" x2="892" y2="500" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="806" y="488" font-family="Cascadia Mono, Consolas, monospace" font-size="12" fill="#475569">
    /rest/v1/*
  </text>

  <!-- auth -> postgres -->
  <path d="M 1200 270 L 1240 270 L 1240 680 L 1208 680" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1248" y="469" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#475569" transform="rotate(90 1248 469)">
    auth schema
  </text>

  <!-- rest -> postgres -->
  <line x1="1050" y1="550" x2="1050" y2="602" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1061" y="582" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#475569">
    SQL + RLS
  </text>

  <!-- migrate -> postgres -->
  <line x1="800" y1="690" x2="892" y2="690" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="812" y="678" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#475569">
    DDL
  </text>

  <!-- Легенда -->
  <text x="60" y="916" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">
    Легенда
  </text>
  <line x1="60" y1="938" x2="108" y2="938" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="118" y="942" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#475569">
    HTTP-запросы
  </text>
  <line x1="60" y1="966" x2="108" y2="966" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
  <text x="118" y="970" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" fill="#64748b">
    локальный доступ
  </text>
</svg>
