<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
  <title id="t">Архитектура проекта «Поток»</title>
  <desc id="d">Браузер, nginx с Vue SPA, GoTrue, PostgREST и PostgreSQL с RLS в Docker Compose.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#475569" />
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#ffffff" />

  <!-- Browser -->
  <rect x="30" y="80" width="240" height="160" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" />
  <text x="52" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1e1b4b">Браузер / телефон</text>
  <text x="52" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" fill="#3730a3">Vue 3 SPA</text>
  <text x="52" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3730a3">Auth + REST</text>
  <text x="52" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3730a3">supabase-js</text>
  <text x="52" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6366f1">адаптивность 360–1440+ px</text>

  <!-- Docker boundary -->
  <rect x="300" y="20" width="870" height="650" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 6" />
  <text x="320" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#64748b" letter-spacing="1.2">DOCKER COMPOSE · ЛОКАЛЬНЫЙ ЗАПУСК</text>

  <!-- nginx -->
  <rect x="330" y="90" width="300" height="170" rx="13" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5" />
  <text x="352" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#155e75">nginx + Vue SPA</text>
  <text x="352" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0e7490">SPA и API на одном origin</text>
  <text x="352" y="178" font-family="Cascadia Mono, Consolas, monospace" font-size="13" fill="#155e75">/            → Vue SPA</text>
  <text x="352" y="202" font-family="Cascadia Mono, Consolas, monospace" font-size="13" fill="#155e75">/auth/v1/*   → auth</text>
  <text x="352" y="226" font-family="Cascadia Mono, Consolas, monospace" font-size="13" fill="#155e75">/rest/v1/*   → rest</text>
  <text x="352" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0e7490">порт 8080 · CORS не нужен</text>

  <!-- GoTrue -->
  <rect x="710" y="90" width="260" height="130" rx="13" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="732" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#166534">GoTrue</text>
  <text x="732" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#166534">регистрация / вход</text>
  <text x="732" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#166534">JWT access + refresh</text>
  <text x="732" y="196" font-family="Cascadia Mono, Consolas, monospace" font-size="13.5" fill="#15803d">auth.users</text>

  <!-- PostgREST -->
  <rect x="710" y="280" width="260" height="130" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
  <text x="732" y="314" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1e40af">PostgREST</text>
  <text x="732" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1e40af">REST API с JWT</text>
  <text x="732" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1e40af">CRUD, фильтры, поиск</text>
  <text x="732" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#1d4ed8">RLS применяется в БД</text>

  <!-- Postgres -->
  <rect x="710" y="470" width="260" height="180" rx="13" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" />
  <text x="732" y="504" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#6b21a8">PostgreSQL</text>
  <text x="732" y="530" font-family="Cascadia Mono, Consolas, monospace" font-size="13.5" fill="#581c87">profiles · tickets</text>
  <text x="732" y="552" font-family="Cascadia Mono, Consolas, monospace" font-size="13.5" fill="#581c87">comments · ticket_events</text>
  <text x="732" y="578" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#6b21a8">RLS: автор / исполнитель / обзор</text>
  <text x="732" y="602" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#6b21a8">триггеры пишут историю</text>
  <text x="732" y="626" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#7e22ce">приватность по умолчанию</text>

  <!-- migrate -->
  <rect x="330" y="320" width="300" height="120" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="352" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">db-setup + migrate</text>
  <text x="352" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#475569">пароли служебных ролей</text>
  <text x="352" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#475569">идемпотентные миграции</text>
  <text x="352" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#64748b">схемы, таблицы, RLS</text>

  <!-- arrows -->
  <line x1="270" y1="160" x2="322" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#a)" />
  <text x="278" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">HTTP :8080</text>

  <line x1="630" y1="155" x2="702" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#a)" />
  <text x="638" y="143" font-family="Cascadia Mono, Consolas, monospace" font-size="11.5" fill="#475569">/auth/v1/*</text>

  <path d="M 630 230 L 670 230 L 670 345 L 702 345" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)" />
  <text x="638" y="220" font-family="Cascadia Mono, Consolas, monospace" font-size="11.5" fill="#475569">/rest/v1/*</text>

  <path d="M 970 155 L 1005 155 L 1005 560 L 978 560" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)" />
  <text x="1014" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569" transform="rotate(90 1014 360)">auth schema</text>

  <line x1="840" y1="410" x2="840" y2="462" stroke="#475569" stroke-width="2" marker-end="url(#a)" />
  <text x="851" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">SQL + RLS</text>

  <path d="M 630 380 L 670 380 L 670 560 L 702 560" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)" />
  <text x="640" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">DDL</text>
</svg>
