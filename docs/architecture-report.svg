<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="t d">
  <title id="t">Архитектура проекта «Поток»</title>
  <desc id="d">Браузер, cloudflared, nginx с Vue SPA, GoTrue, PostgREST и PostgreSQL с RLS в Docker Compose.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#475569" />
    </marker>
  </defs>

  <rect width="1200" height="820" fill="#ffffff" />

  <!-- Browser -->
  <rect x="30" y="90" width="250" height="170" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" />
  <text x="52" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1e1b4b">Браузер / телефон</text>
  <text x="52" y="153" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" fill="#3730a3">Vue 3 SPA</text>
  <text x="52" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3730a3">Auth + REST</text>
  <text x="52" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#3730a3">supabase-js</text>
  <text x="52" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#6366f1">адаптивность 360–1440+ px</text>

  <!-- Docker boundary -->
  <rect x="310" y="20" width="860" height="710" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 6" />
  <text x="330" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#64748b" letter-spacing="1.2">DOCKER COMPOSE · ОДНА КОМАНДА</text>

  <!-- Cloudflare -->
  <rect x="340" y="70" width="280" height="150" rx="13" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" />
  <text x="362" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#9a3412">cloudflared</text>
  <text x="362" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#c2410c">HTTPS-туннель</text>
  <text x="362" y="153" font-family="Cascadia Mono, Consolas, monospace" font-size="13.5" fill="#9a3412">*.trycloudflare.com</text>
  <text x="362" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c2410c">без аккаунта</text>
  <text x="362" y="199" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#c2410c">адрес меняется после restart</text>

  <!-- nginx -->
  <rect x="340" y="300" width="310" height="160" rx="13" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5" />
  <text x="362" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#155e75">nginx + Vue SPA</text>
  <text x="362" y="362" font-family="Cascadia Mono, Consolas, monospace" font-size="14" fill="#155e75">/            → Vue SPA</text>
  <text x="362" y="386" font-family="Cascadia Mono, Consolas, monospace" font-size="14" fill="#155e75">/auth/v1/*   → auth</text>
  <text x="362" y="410" font-family="Cascadia Mono, Consolas, monospace" font-size="14" fill="#155e75">/rest/v1/*   → rest</text>
  <text x="362" y="436" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#0e7490">порт 8080 · один origin · без CORS</text>

  <!-- GoTrue -->
  <rect x="730" y="200" width="270" height="130" rx="13" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="752" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#166534">GoTrue</text>
  <text x="752" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#166534">регистрация / вход</text>
  <text x="752" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#166534">JWT access + refresh</text>
  <text x="752" y="306" font-family="Cascadia Mono, Consolas, monospace" font-size="13.5" fill="#15803d">auth.users</text>

  <!-- PostgREST -->
  <rect x="730" y="390" width="270" height="130" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
  <text x="752" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1e40af">PostgREST</text>
  <text x="752" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1e40af">REST API с JWT</text>
  <text x="752" y="472" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1e40af">CRUD, фильтры, поиск</text>
  <text x="752" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#1d4ed8">RLS применяется в БД</text>

  <!-- Postgres -->
  <rect x="730" y="580" width="270" height="140" rx="13" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" />
  <text x="752" y="614" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#6b21a8">PostgreSQL</text>
  <text x="752" y="640" font-family="Cascadia Mono, Consolas, monospace" font-size="13.5" fill="#581c87">profiles · tickets</text>
  <text x="752" y="662" font-family="Cascadia Mono, Consolas, monospace" font-size="13.5" fill="#581c87">comments · ticket_events</text>
  <text x="752" y="686" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#6b21a8">RLS: автор / исполнитель / обзор</text>
  <text x="752" y="708" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#6b21a8">триггеры пишут историю</text>

  <!-- arrows -->
  <line x1="280" y1="175" x2="332" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#a)" />
  <text x="292" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">HTTPS</text>

  <line x1="480" y1="220" x2="480" y2="292" stroke="#475569" stroke-width="2" marker-end="url(#a)" />
  <text x="490" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">app:80</text>

  <path d="M 650 350 L 690 350 L 690 265 L 722 265" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)" />
  <text x="696" y="340" font-family="Cascadia Mono, Consolas, monospace" font-size="12" fill="#475569">/auth</text>

  <line x1="650" y1="420" x2="722" y2="455" stroke="#475569" stroke-width="2" marker-end="url(#a)" />
  <text x="676" y="442" font-family="Cascadia Mono, Consolas, monospace" font-size="12" fill="#475569">/rest</text>

  <path d="M 1000 265 L 1045 265 L 1045 650 L 1008 650" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)" />
  <text x="1054" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569" transform="rotate(90 1054 460)">auth schema</text>

  <line x1="865" y1="520" x2="865" y2="572" stroke="#475569" stroke-width="2" marker-end="url(#a)" />
  <text x="876" y="552" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">SQL</text>

  <!-- n8n note -->
  <rect x="30" y="760" width="1140" height="42" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="48" y="786" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">n8n в этом решении не используется — отдельного инстанса n8n и доступов к нему нет.</text>
</svg>
